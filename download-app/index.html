<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tải Ứng Dụng — Đếm Ngược Thi THPTQG &amp; ĐGNL</title>
  <meta name="description" content="Tải ứng dụng Đếm Ngược Thi THPTQG & ĐGNL trên App Store và Google Play.">
  <link rel="shortcut icon" type="image/png" href="../playstore-removebg-preview.png">
  <link rel="icon" type="image/png" href="../playstore-removebg-preview.png">
  <link rel="apple-touch-icon" href="../playstore-removebg-preview.png">
  <meta name="msapplication-TileImage" content="../playstore-removebg-preview.png">

  <meta property="og:title" content="Đếm Ngược Thi — THPTQG & ĐGNL">
  <meta property="og:description" content="Tải ứng dụng Đếm Ngược Thi THPTQG & ĐGNL trên App Store và Google Play.">
  <meta property="og:image" content="../playstore-removebg-preview.png">
  <meta property="og:type" content="website">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --night: #0b091a;
      --glass: rgba(15, 10, 35, 0.6);
      --accent: #c4b0ff;
      --accent2: #9d7ff5;
      --text: #e2d9f3;
      --muted: #a393c8;
      --white: #ffffff;
      --border: rgba(196, 176, 255, 0.15);
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--night);
      color: var(--text);
      line-height: 1.6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
          rgba(11, 9, 26, 0.35) 0%,
          rgba(11, 9, 26, 0.55) 45%,
          rgba(11, 9, 26, 0.92) 82%,
          rgba(11, 9, 26, 0.98) 100%);
    }

    .page {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 16px;
      text-align: center;
    }

    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 0 0 1px rgba(196, 176, 255, 0.3),
        0 20px 56px rgba(0, 0, 0, 0.65),
        0 0 90px rgba(157, 127, 245, 0.3);
      margin-bottom: 20px;
      display: block;
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(26px, 5.2vw, 42px);
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.02em;
      line-height: 1.28;
      max-width: 640px;
      margin-bottom: 16px;
    }

    h1 .line2 {
      display: block;
      color: var(--accent);
      font-size: 0.72em;
      margin-top: 6px;
    }

    .sub {
      font-size: 15px;
      color: var(--muted);
      max-width: 460px;
      margin-bottom: 24px;
    }

    .badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .badge-link {
      display: block;
      height: 42px;
      transition: transform 0.25s ease, filter 0.25s ease;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
    }

    .badge-link:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .badge-link:active {
      transform: translateY(-1px);
    }

    .badge-link img {
      display: block;
      height: 100%;
      width: auto;
    }

    .features {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 580px;
      margin-bottom: 8px;
    }

    .chip {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    footer {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      text-align: center;
      padding: 0 24px 16px;
      font-size: 12px;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>

  <div class="bg-wrap">
    <video autoplay muted loop playsinline poster="../flower-field/flower-field.jpg">
      <source src="../flower-field/flower-field.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
  </div>

  <div class="page">
    <img src="../playstore-removebg-preview.png" alt="Đếm Ngược Thi" class="app-icon">

    <h1>Đếm Ngược Ngày Thi<br>THPT & ĐGNL<span class="line2">Đồng hành cùng các sĩ tử Việt Nam 🥰</span></h1>
    <p class="sub">Theo dõi ngày thi chính xác từng ngày, giờ, phút đến kỳ thi.</p>

    <div class="badges">
      <a class="badge-link appstore"
        href="https://apps.apple.com/us/app/%C4%91%E1%BA%BFm-ng%C6%B0%E1%BB%A3c-thi-thptqg-%C4%91gnl/id6785853312"
        target="_blank" rel="noopener">
        <img src="assets/app-store-badge.svg" alt="Download on the App Store">
      </a>
      <a class="badge-link googleplay" href="https://play.google.com/store/apps/details?id=com.fish171204.demnguocthi"
        target="_blank" rel="noopener">
        <img src="assets/google-play-badge.png" alt="Get it on Google Play">
      </a>
    </div>

    <div class="features">
      <span class="chip">⏱️ Đếm ngược chính xác</span>
      <span class="chip">🎵 Nhạc Lofi tập trung</span>
      <span class="chip">🍅 Pomodoro</span>
      <span class="chip">📝 Ghi chú</span>
      <span class="chip">🍃 Hiệu ứng thiên nhiên</span>
      <span class="chip">📱 Widget màn hình chính</span>
    </div>
  </div>

  <footer>
    © 2026 Là Lá Labs · <a href="../">Chính sách bảo mật</a>
  </footer>

</body>

</html>
